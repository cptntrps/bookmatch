name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest pytest-asyncio
      # Suite is hermetic where it must be: tests needing aurora-local services
      # (Ollama embeddings, livingos-api gateway) self-skip; everything else must pass.
      - run: python3 -m pytest -q
