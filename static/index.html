<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Match</title>
<meta name="description" content="A taste engine for one person's library: embeddings, neighbour-gap recommendations, and any axis you can name.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%230f1b17%27/%3E%3Cpath d=%27M8 7h5a3 3 0 0 1 3 3v15a2 2 0 0 0-2-2H8zM24 7h-5a3 3 0 0 0-3 3v15a2 2 0 0 1 2-2h6z%27 fill=%27%23cfa75a%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Library green, warm paper, brass fittings, red ink for what the reader loves. */
  :root {
    color-scheme: dark;
    --bg: #0f1b17; --surface: #152420; --raise: #1b2e28;
    --line: #2a3f36; --line-strong: #3a5449;
    --ink: #ebe6da; --muted: #96a59b; --faded: #627a70;
    --brass: #cfa75a; --brass-dim: #8a6f3b; --red: #e06a3a;
    --display: "Fraunces", "Iowan Old Style", Georgia, serif;
    --body: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html { background: var(--bg); }
  body { margin: 0; font: 15px/1.5 var(--body); color: var(--ink); background: var(--bg); min-height: 100vh; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 4px; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line-strong); background: var(--raise); border-radius: 8px; padding: .5rem .9rem; }
  button.primary { background: var(--brass); border-color: var(--brass); color: #1b1407; font-weight: 600; }
  button.quiet { background: transparent; border-color: transparent; color: var(--muted); padding: .3rem .5rem; }
  button.quiet:hover { color: var(--ink); border-color: var(--line); }
  button:disabled { opacity: .55; cursor: default; }
  input { width: 100%; background: var(--bg); border: 1px solid var(--line-strong); border-radius: 8px; padding: .55rem .7rem; }
  input::placeholder { color: var(--faded); }

  /* top bar: wordmark + readers as library cards */
  .top { display: flex; align-items: center; gap: 1.2rem; flex-wrap: wrap; padding: 1rem 1.5rem; border-bottom: 1px solid var(--line); }
  .brand { font-family: var(--display); font-style: italic; font-weight: 400; font-size: 1.55rem; letter-spacing: -.01em; margin: 0; }
  .brand b { font-style: normal; font-weight: 500; color: var(--brass); }
  .readers { display: flex; gap: .5rem; flex-wrap: wrap; margin-left: auto; }
  .chip { display: flex; flex-direction: column; align-items: flex-start; gap: 0; padding: .35rem .8rem; line-height: 1.2; border-radius: 8px; }
  .chip small { font-family: var(--mono); font-size: .68rem; color: var(--muted); }
  .chip[aria-pressed="true"] { border-color: var(--brass); background: var(--surface); }
  .chip.add { color: var(--muted); }

  main { max-width: 1180px; margin: 0 auto; padding: 1.4rem 1.5rem 5rem; }
  .eyebrow { font-family: var(--mono); font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--brass-dim); margin: 0 0 .6rem; }
  h2.title { font-family: var(--display); font-weight: 500; font-size: 1.35rem; margin: 0 0 .25rem; }
  .hint { color: var(--muted); margin: 0 0 .9rem; max-width: 60ch; }
  .notice { border-radius: 8px; padding: .6rem .8rem; margin: .8rem 0; border: 1px solid var(--line-strong); background: var(--surface); }
  .notice.error { border-color: var(--red); color: #f2c7b3; }
  .notice.warn { border-color: var(--brass-dim); color: #e6d2a4; }
  .notice .row { align-items: center; justify-content: space-between; }
  .empty { display: grid; place-items: center; min-height: 50vh; text-align: center; }
  .empty h1 { font-family: var(--display); font-weight: 400; font-size: clamp(2rem, 5vw, 3.4rem); line-height: 1.05; margin: 0 0 .8rem; max-width: 22ch; }
  .empty h1 em { color: var(--brass); font-style: italic; }

  /* reader head */
  .reader { display: flex; align-items: baseline; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.2rem; }
  .reader h1 { font-family: var(--display); font-weight: 500; font-size: clamp(2rem, 4vw, 2.8rem); line-height: 1; margin: 0; letter-spacing: -.01em; }
  .reader .stats { font-family: var(--mono); font-size: .78rem; color: var(--muted); }
  .reader .spacer { flex: 1; }

  /* the axis: the page's signature */
  .axis { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 1.1rem 1.2rem 1rem; margin-bottom: 1.2rem; }
  .axis-form { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: .5rem; align-items: center; }
  .axis-form .vs { font-family: var(--display); font-style: italic; color: var(--muted); padding: 0 .2rem; }
  .presets { display: flex; gap: .4rem; flex-wrap: wrap; margin: .6rem 0 .2rem; }
  .presets button { font-size: .8rem; padding: .25rem .6rem; border-radius: 999px; color: var(--muted); }
  .presets button:hover { color: var(--ink); }
  .poles-label { display: flex; justify-content: space-between; font-family: var(--display); font-size: 1.05rem; margin: .9rem 0 .1rem; }
  .poles-label span:last-child { color: var(--brass); }
  .spectrum { display: block; width: 100%; height: auto; }
  .spectrum .tick { stroke-linecap: round; }
  .spectrum .tick.loved { stroke: var(--red); }
  .spectrum .tick.liked { stroke: var(--ink); opacity: .8; }
  .spectrum .tick.tolerated { stroke: var(--faded); }
  .spectrum .cand { fill: var(--surface); stroke: var(--brass); stroke-width: 1.6; }
  .spectrum.fresh .tick, .spectrum.fresh .cand { animation: rise .45s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .legend { display: flex; gap: 1.1rem; flex-wrap: wrap; font-family: var(--mono); font-size: .7rem; color: var(--muted); margin: .2rem 0 .8rem; }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: .35rem; vertical-align: -1px; border-radius: 2px; }
  .legend .l-loved i { background: var(--red); } .legend .l-liked i { background: var(--ink); opacity: .8; }
  .legend .l-tol i { background: var(--faded); } .legend .l-cand i { border: 1.6px solid var(--brass); border-radius: 50%; }
  .agreement { font-family: var(--display); font-style: italic; font-size: 1.05rem; margin: .4rem 0 1rem; color: var(--ink); }
  .ends { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
  .ends .right { text-align: right; }
  .ends ol { list-style: none; margin: 0; padding: 0; }
  .ends li { padding: .22rem 0; border-bottom: 1px solid var(--line); font-size: .9rem; }
  .ends li .a { color: var(--muted); }
  .ends li.cand { color: var(--brass); }
  .ends li.cand .a { color: var(--brass-dim); }
  .ends .sub { font-family: var(--mono); font-size: .68rem; color: var(--faded); margin: .7rem 0 .2rem; letter-spacing: .08em; text-transform: uppercase; }

  /* profile */
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 1rem; margin-bottom: 1.2rem; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem 1rem; }
  .card ol { list-style: none; margin: 0; padding: 0; }
  .card li { display: grid; grid-template-columns: 1fr auto; gap: .6rem; padding: .3rem 0; border-bottom: 1px solid var(--line); font-size: .88rem; line-height: 1.3; }
  .card li:last-child { border-bottom: 0; }
  .card li .a { color: var(--muted); display: block; font-size: .8rem; }
  .card li .r { font-family: var(--mono); font-size: .75rem; color: var(--muted); white-space: nowrap; }
  .card li .r.loved { color: var(--red); }

  /* candidates and verdicts */
  .cands { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem 1rem; margin-bottom: 1.2rem; }
  .cand-row { display: grid; grid-template-columns: 1fr 220px; gap: .3rem 1rem; align-items: center; padding: .55rem 0; border-bottom: 1px solid var(--line); }
  .cand-row:last-child { border-bottom: 0; }
  .cand-row .a { color: var(--muted); font-size: .82rem; display: block; }
  .support { display: grid; gap: .2rem; }
  .support .bar { height: 4px; background: var(--raise); border-radius: 2px; overflow: hidden; }
  .support .bar i { display: block; height: 100%; width: var(--w); background: var(--brass); }
  .support small { font-family: var(--mono); font-size: .68rem; color: var(--muted); white-space: nowrap; }
  .verdicts { grid-column: 1 / -1; display: flex; gap: .35rem; flex-wrap: wrap; }
  .verdicts button { font-size: .78rem; padding: .22rem .65rem; border-radius: 999px; background: transparent; color: var(--muted); }
  .verdicts button:hover, .verdicts button:focus-visible { color: var(--ink); }
  .verdicts button[data-v="want"]:hover { border-color: var(--brass); color: var(--brass); }
  .verdicts button[data-v="read"]:hover { border-color: var(--ink); }
  .verdicts button[data-v="disliked"]:hover { border-color: var(--red); color: var(--red); }
  .verdicts button[data-v="not_interested"] { border-color: transparent; }
  .cand-row.leaving { opacity: 0; transform: translateX(8px); transition: opacity .25s, transform .25s; }
  .decided details { border-top: 1px solid var(--line); padding: .35rem 0; }
  .decided details:first-of-type { border-top: 0; }
  .decided summary { cursor: pointer; display: flex; justify-content: space-between; align-items: baseline; padding: .3rem 0; list-style: none; }
  .decided summary::-webkit-details-marker { display: none; }
  .decided summary .n { font-family: var(--mono); font-size: .75rem; color: var(--muted); }
  .decided summary .label { font-family: var(--display); font-size: 1.05rem; }
  .decided summary.v-want .label { color: var(--brass); }
  .decided summary.v-disliked .label { color: var(--red); }
  .decided ol { list-style: none; margin: 0 0 .4rem; padding: 0; }
  .decided li { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; padding: .3rem 0; font-size: .88rem; border-top: 1px dashed var(--line); }
  .decided li .who { flex: 1; min-width: 12rem; }
  .decided li .a { color: var(--muted); font-size: .8rem; }
  .decided li .when { font-family: var(--mono); font-size: .68rem; color: var(--faded); }
  .decided li button { font-size: .75rem; padding: .18rem .55rem; border-radius: 999px; }

  /* chat */
  .chat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: .9rem 1rem; }
  .log { display: flex; flex-direction: column; gap: .6rem; max-height: 50vh; overflow-y: auto; margin-bottom: .7rem; }
  .msg { padding: .55rem .8rem; border-radius: 10px; white-space: pre-wrap; line-height: 1.45; max-width: 85%; }
  .msg.user { background: var(--raise); align-self: flex-end; }
  .msg.bot { background: var(--bg); border: 1px solid var(--line); align-self: flex-start; }
  .msg.bot.wait { color: var(--muted); font-style: italic; }
  .row { display: flex; gap: .5rem; }
  .examples { display: flex; gap: .4rem; flex-wrap: wrap; margin-top: .5rem; }
  .examples button { font-size: .78rem; padding: .22rem .55rem; border-radius: 999px; color: var(--muted); }

  /* toast with undo */
  .toast { position: fixed; left: 50%; bottom: 1.2rem; transform: translateX(-50%); display: flex; gap: .8rem; align-items: center;
           background: var(--ink); color: var(--bg); padding: .6rem .9rem .6rem 1rem; border-radius: 999px; box-shadow: 0 8px 30px rgba(0,0,0,.45); z-index: 20; max-width: min(92vw, 560px); }
  .toast[hidden] { display: none; }
  .toast button { background: var(--bg); color: var(--ink); border-color: var(--bg); padding: .3rem .7rem; border-radius: 999px; font-weight: 600; }
  .toast button[hidden] { display: none; }
  .toast .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  dialog { background: var(--surface); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 12px; padding: 1.2rem 1.3rem; width: min(440px, 92vw); }
  dialog::backdrop { background: rgba(5, 10, 8, .7); }
  dialog h2 { font-family: var(--display); font-weight: 500; margin: 0 0 .3rem; }
  dialog p { color: var(--muted); margin: 0 0 .9rem; font-size: .9rem; }
  dialog label { display: block; font-family: var(--mono); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: .6rem 0 .25rem; }
  dialog .actions { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1rem; }

  @media (max-width: 720px) {
    .top { padding: .9rem 1rem; } main { padding: 1rem 1rem 5rem; }
    .readers { margin-left: 0; }
    .axis-form { grid-template-columns: 1fr; } .axis-form .vs { text-align: center; }
    .ends { grid-template-columns: 1fr; } .ends .right { text-align: left; }
    .cand-row { grid-template-columns: 1fr; gap: .4rem; }
  }
  @media (prefers-reduced-motion: reduce) { .spectrum.fresh .tick, .spectrum.fresh .cand { animation: none; } .cand-row.leaving { transition: none; } }
</style>
</head>
<body>
<header class="top">
  <h1 class="brand">Book <b>Match</b></h1>
  <nav class="readers" id="readers" aria-label="Readers"></nav>
</header>
<main id="main"><div class="empty"><div><p class="eyebrow">Loading</p></div></div></main>
<div class="toast" id="toast" hidden role="status"><span class="t" id="toastText"></span><button id="toastUndo">Undo</button></div>

<dialog id="addDialog">
  <h2>Add a reader</h2>
  <p>Any public Goodreads profile. The shelf is read from its public feed; a private profile is reported, never guessed.</p>
  <form method="dialog" id="addForm">
    <label for="url">Goodreads profile URL or user id</label>
    <input id="url" required placeholder="https://www.goodreads.com/user/show/12345678">
    <label for="label">Name to show</label>
    <input id="label" placeholder="e.g. Mom">
    <div class="actions"><button type="button" class="quiet" id="cancelAdd">Cancel</button><button class="primary" id="confirmAdd">Add reader</button></div>
  </form>
</dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
// every untrusted string (titles, authors, labels, model output) is escaped or set as textContent
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PRESETS = [
  ['French vs American', ['French literature', 'a novel set in France'], ['American literature', 'a novel set in small-town America']],
  ['Melancholy vs comic', ['melancholy, grief, quiet sorrow'], ['comic, light-hearted, funny']],
  ['Summer vs winter', ['summer, heat, the sea, holidays'], ['winter, snow, cold, long nights']],
  ['Experimental vs conventional', ['experimental form, fragmented, avant-garde'], ['conventional, plot-driven, straightforward']],
];
// verdicts: what each one does is written where the reader decides, not in a help page
const VERDICTS = [
  ['want', 'Want to read', 'kept on your list'],
  ['read', 'Read it', 'joins your shelf as read'],
  ['disliked', "Didn't like it", 'joins your shelf with a low rating'],
  ['not_interested', 'Not interested', 'hidden'],
];
const VLABEL = Object.fromEntries(VERDICTS.map(v => [v[0], v[1]]));
let readers = [], sel = null, history = [], current = null;

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) { const e = await r.json().catch(() => ({detail: r.statusText})); throw new Error(e.detail || r.statusText); }
  return r.json();
}
const call = (method, path, body) => api(path, {method, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
const post = (path, body) => call('POST', path, body);

// ---------- readers ----------
async function loadReaders() {
  readers = await api('/api/accounts');
  $('#readers').innerHTML = readers.map(a =>
    `<button class="chip" data-id="${a.id}" aria-pressed="${sel && sel.id === a.id}">${esc(a.label)}<small>${a.analyzed ? 'analyzed' : 'not analyzed yet'}</small></button>`).join('')
    + `<button class="chip add" id="openAdd">+ Add reader</button>`;
  document.querySelectorAll('.chip[data-id]').forEach(el => el.onclick = () => select(readers.find(a => a.id == el.dataset.id)));
  $('#openAdd').onclick = () => $('#addDialog').showModal();
}
async function select(a) {
  sel = a; history = [];
  await loadReaders();
  current = await api('/api/accounts/' + a.id);
  render(a, current);
}

// ---------- rendering ----------
const rating = r => r ? `<span class="r ${r >= 4 ? 'loved' : ''}">${r.toFixed(0)} / 5</span>` : '<span class="r">unrated</span>';
const bookLi = b => `<li><span>${esc(b.title)}<span class="a">${esc(b.author)}</span></span>${rating(b.myrating)}</li>`;
const nameSpan = b => `${esc(b.title)} <span class="a">${esc(b.author)}</span>`;
const day = iso => iso ? new Date(iso).toLocaleDateString(undefined, {month: 'short', day: 'numeric'}) : '';

function renderEmpty(a) {
  $('#main').innerHTML = `<div class="empty"><div>
    <p class="eyebrow">${a ? esc(a.label) : 'No reader selected'}</p>
    <h1>${a ? 'This shelf has not been <em>read</em> yet.' : 'Every shelf has a <em>shape</em>.'}</h1>
    <p class="hint" style="margin:0 auto 1.2rem">${a
      ? 'Analysis fetches the public shelf, embeds every book, matches it into a corpus of 876k readers and finds what the nearest ones love that this shelf lacks. About a minute.'
      : 'Add a Goodreads reader to see what they love, where their taste runs against the crowd, and what readers nearest to them have that they do not.'}</p>
    ${a ? '<button class="primary" id="run">Analyze shelf</button>' : '<button class="primary" id="openAdd2">Add a reader</button>'}
  </div></div>`;
  if (a) $('#run').onclick = () => runAnalyze(a);
  else $('#openAdd2').onclick = () => $('#addDialog').showModal();
}

function render(a, d) {
  const analysis = d.analysis;
  if (!analysis) return renderEmpty(a);
  const p = analysis.profile;
  const matched = Math.round(analysis.match_rate * 100);
  $('#main').innerHTML = `
    <div class="reader">
      <h1>${esc(a.label)}</h1>
      <span class="stats">${p.n_books} books · ${p.n_rated} rated · mean ${p.mean_rating} · ${matched}% found in the corpus</span>
      <span class="spacer"></span>
      <button class="quiet" id="run">Re-analyze</button>
    </div>
    ${matched < 40 ? `<div class="notice warn">Only ${matched}% of this shelf matched the corpus, so the recommendations below rest on few neighbours.</div>` : ''}

    <section class="axis" aria-labelledby="axisTitle">
      <p class="eyebrow">Any axis you can name</p>
      <h2 class="title" id="axisTitle">Where does this shelf fall between two ideas?</h2>
      <p class="hint">Name the two poles. Every book, and every candidate below, is placed by a single dot product in the embedding space. Nothing is labelled.</p>
      <form class="axis-form" id="axisForm">
        <input id="neg" placeholder="negative pole, e.g. American literature" aria-label="negative pole">
        <span class="vs">vs</span>
        <input id="pos" placeholder="positive pole, e.g. French literature" aria-label="positive pole" required>
        <button class="primary" id="plot">Plot</button>
      </form>
      <div class="presets">${PRESETS.map((pr, i) => `<button type="button" data-p="${i}">${esc(pr[0])}</button>`).join('')}</div>
      <div id="axisOut"></div>
    </section>

    <section class="grid" aria-label="Taste profile">
      <div class="card"><p class="eyebrow">Loves most</p><ol>${(p.loved || []).map(bookLi).join('')}</ol></div>
      <div class="card"><p class="eyebrow">Merely tolerates</p><ol>${(p.tolerated || []).map(bookLi).join('')}</ol></div>
      <div class="card"><p class="eyebrow">Loves more than the crowd</p><ol>${(p.loves_more_than_world || []).map(bookLi).join('')}</ol></div>
      <div class="card"><p class="eyebrow">Blind spot</p><ol>${(p.blind_spot || []).map(bookLi).join('')}</ol></div>
    </section>

    <section class="cands" aria-labelledby="candTitle" id="cands"></section>
    <section class="cands decided" aria-labelledby="decTitle" id="decided"></section>

    <section class="chat" aria-labelledby="chatTitle">
      <p class="eyebrow">Ask</p>
      <h2 class="title" id="chatTitle">Talk about ${esc(a.label)}'s taste</h2>
      <p class="hint">The agent knows the shelf and the candidates, and can plot any axis itself before it answers.</p>
      <div class="log" id="log" aria-live="polite"></div>
      <div class="row"><input id="msg" placeholder="e.g. something for a long train ride, nothing bleak" aria-label="message"><button class="primary" id="send">Ask</button></div>
      <div class="examples">
        <button type="button">What would ${esc(a.label)} think of Elena Ferrante?</button>
        <button type="button">Pick the three candidates most like what they love.</button>
        <button type="button">Which of their favourites is least like the rest?</button>
      </div>
    </section>`;

  $('#run').onclick = () => runAnalyze(a);
  $('#axisForm').onsubmit = e => { e.preventDefault(); plotAxis(a); };
  document.querySelectorAll('.presets button').forEach(b => b.onclick = () => {
    const [, pos, neg] = PRESETS[b.dataset.p];
    $('#pos').value = pos.join(', '); $('#neg').value = neg.join(', '); plotAxis(a);
  });
  renderDecisions(a, d);
  $('#send').onclick = send;
  $('#msg').onkeydown = e => { if (e.key === 'Enter') send(); };
  document.querySelectorAll('.examples button').forEach(b => b.onclick = () => { $('#msg').value = b.textContent; send(); });
  // the signature draws itself: first preset, on load
  const [, pos, neg] = PRESETS[0]; $('#pos').value = pos.join(', '); $('#neg').value = neg.join(', '); plotAxis(a);
}

// candidates and the decided lists re-render on their own after a verdict; axis and profile stay put
function renderDecisions(a, d) {
  const recs = (d.analysis && d.analysis.recs) || [];
  const matched = Math.round((d.analysis ? d.analysis.match_rate : 0) * 100);
  const maxSup = Math.max(1, ...recs.map(r => r.n_supporters || 0));
  $('#cands').innerHTML = `
    <p class="eyebrow">Neighbour gap</p>
    <h2 class="title" id="candTitle">What readers nearest to ${esc(a.label)} love, that this shelf lacks</h2>
    <p class="hint">Scored over the ${matched}% of the shelf found in the corpus. The bar is how many of the hundred nearest readers rated it four stars or more. Decide with one tap; every verdict can be undone.</p>
    ${recs.length ? recs.map((r, i) => `<div class="cand-row" data-i="${i}">
        <div>${nameSpan(r)}</div>
        <div class="support"><div class="bar"><i style="--w:${Math.round(100 * (r.n_supporters || 0) / maxSup)}%"></i></div><small>${esc(r.n_supporters)} of 100 nearest readers</small></div>
        <div class="verdicts" role="group" aria-label="Your verdict on ${esc(r.title)}">
          ${VERDICTS.map(([v, label, effect]) => `<button type="button" data-v="${v}" title="${esc(effect)}">${esc(label)}</button>`).join('')}
        </div>
      </div>`).join('') : '<p class="hint">Every candidate has a verdict. Re-analyze to bring a fresh set.</p>'}`;
  document.querySelectorAll('#cands .verdicts button').forEach(btn => btn.onclick = () => {
    const row = btn.closest('.cand-row'); const r = recs[Number(row.dataset.i)];
    row.classList.add('leaving');
    decide(a, r, btn.dataset.v);
  });

  const g = d.verdicts || {};
  const total = VERDICTS.reduce((n, [v]) => n + (g[v] || []).length, 0);
  const pending = d.pending_shelf_changes || 0;
  $('#decided').innerHTML = `
    <p class="eyebrow">Your verdicts</p>
    <h2 class="title" id="decTitle">${total ? `${total} decided` : 'Nothing decided yet'}</h2>
    ${pending ? `<div class="notice warn"><div class="row"><span>${pending} "read" or "didn't like" verdict${pending > 1 ? 's' : ''} will join the shelf at the next analysis.</span><button class="quiet" id="runPending">Re-analyze now</button></div></div>` : ''}
    ${VERDICTS.map(([v, label, effect]) => {
      const rows = g[v] || [];
      return `<details ${v === 'want' && rows.length ? 'open' : ''}>
        <summary class="v-${v}"><span class="label">${esc(label)}</span><span class="n">${rows.length} · ${esc(effect)}</span></summary>
        ${rows.length ? `<ol>${rows.map((b, i) => `<li data-v="${v}" data-i="${i}">
            <span class="who">${esc(b.title)} <span class="a">${esc(b.author)}</span></span>
            <span class="when">${day(b.decided_at)}</span>
            ${v === 'want' ? `<button type="button" data-to="read">Read it</button><button type="button" data-to="disliked">Didn't like it</button>` : ''}
            <button type="button" class="quiet" data-to="undo">Undo</button>
          </li>`).join('')}</ol>` : ''}
      </details>`; }).join('')}`;
  if (pending) $('#runPending').onclick = () => runAnalyze(a);
  document.querySelectorAll('#decided li button').forEach(btn => btn.onclick = () => {
    const li = btn.closest('li'); const b = (g[li.dataset.v] || [])[Number(li.dataset.i)];
    if (btn.dataset.to === 'undo') undo(a, b, true); else decide(a, b, btn.dataset.to);
  });
}

// ---------- verdicts ----------
let toastTimer = null, toastUndo = null;
function toast(text, onUndo) {
  $('#toastText').textContent = text; toastUndo = onUndo;
  $('#toastUndo').hidden = !onUndo;
  $('#toast').hidden = false; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $('#toast').hidden = true; toastUndo = null; }, 7000);
}
$('#toastUndo').onclick = () => { const f = toastUndo; $('#toast').hidden = true; toastUndo = null; if (f) f(); };
async function refreshDecisions(a) {
  current = await api('/api/accounts/' + a.id); renderDecisions(a, current);
}
async function decide(a, book, v) {
  try {
    await post('/api/accounts/' + a.id + '/verdict', {title: book.title, author: book.author || '', verdict: v});
    await refreshDecisions(a);
    toast(`${book.title}: ${VLABEL[v]}`, () => undo(a, book, false));
  } catch (e) { notice(e.message); await refreshDecisions(a); }
}
async function undo(a, book, say) {
  try {
    await call('DELETE', '/api/accounts/' + a.id + '/verdict', {title: book.title, author: book.author || ''});
    await refreshDecisions(a);
    if (say) toast(`${book.title}: back among the candidates`, null);
  } catch (e) { notice(e.message); }
}

// ---------- the axis ----------
const split = s => s.split(',').map(t => t.trim()).filter(Boolean);
function tickClass(r) { return r >= 4 ? 'loved' : r > 0 && r <= 2 ? 'tolerated' : 'liked'; }
function spectrum(res) {
  const X = x => 500 + x * 450;
  const ticks = res.shelf.map(b => {
    const h = b.myrating ? 14 + b.myrating * 7 : 10;
    return `<line class="tick ${tickClass(b.myrating)}" x1="${X(b.x).toFixed(1)}" x2="${X(b.x).toFixed(1)}" y1="88" y2="${88 - h}" stroke-width="2"><title>${esc(b.title)} — ${esc(b.author)}${b.myrating ? ` · rated ${b.myrating}` : ''}</title></line>`;
  }).join('');
  // candidates sit below the line in three rows; within a row a marker is nudged right of the
  // previous one when they would overlap, so a crowd still reads as a crowd, not as one dot
  const rows = [-Infinity, -Infinity, -Infinity];
  const cands = [...res.candidates].sort((a, b) => a.x - b.x).map((c, i) => {
    const row = i % 3, cx = Math.max(X(c.x), rows[row] + 12); rows[row] = cx;
    return `<circle class="cand" cx="${cx.toFixed(1)}" cy="${104 + row * 11}" r="5"><title>candidate: ${esc(c.title)} — ${esc(c.author)}</title></circle>`;
  }).join('');
  return `<svg class="spectrum fresh" viewBox="0 0 1000 136" role="img" aria-label="Books placed along the axis">
    <line x1="40" x2="960" y1="88" y2="88" stroke="var(--line-strong)" stroke-width="1"/>
    <line x1="500" x2="500" y1="82" y2="94" stroke="var(--line-strong)" stroke-width="1"/>
    ${ticks}${cands}</svg>`;
}
async function plotAxis(a) {
  const pos = split($('#pos').value), neg = split($('#neg').value);
  if (!pos.length) return notice('Name at least one phrase for the positive pole.');
  const btn = $('#plot'); btn.disabled = true; btn.textContent = 'Plotting…';
  const label = (pos[0] || 'axis').split(' ')[0].toLowerCase();
  try {
    const res = await post('/api/accounts/' + a.id + '/axis', {label, positive: pos, negative: neg});
    const left = neg.length ? neg[0] : 'opposite', right = pos[0];
    const top = res.shelf.slice(0, 5), bottom = res.shelf.slice(-5).reverse();
    const ctop = res.candidates.slice(0, 3), cbottom = res.candidates.slice(-3).reverse();
    $('#axisOut').innerHTML = `
      <div class="poles-label"><span>← ${esc(left)}</span><span>${esc(right)} →</span></div>
      ${spectrum(res)}
      <div class="legend"><span class="l-loved"><i></i>rated 4 to 5</span><span class="l-liked"><i></i>rated 3 or unrated</span><span class="l-tol"><i></i>rated 1 to 2</span><span class="l-cand"><i></i>candidate</span></div>
      <p class="agreement">${esc(res.rating_agreement.reading)}</p>
      <div class="ends">
        <div><ol>${bottom.map(b => `<li>${nameSpan(b)}</li>`).join('')}</ol>
          ${cbottom.length ? `<p class="sub">candidates this way</p><ol>${cbottom.map(b => `<li class="cand">${nameSpan(b)}</li>`).join('')}</ol>` : ''}</div>
        <div class="right"><ol>${top.map(b => `<li>${nameSpan(b)}</li>`).join('')}</ol>
          ${ctop.length ? `<p class="sub">candidates this way</p><ol>${ctop.map(b => `<li class="cand">${nameSpan(b)}</li>`).join('')}</ol>` : ''}</div>
      </div>`;
  } catch (e) { $('#axisOut').innerHTML = `<div class="notice error">${esc(e.message)}</div>`; }
  btn.disabled = false; btn.textContent = 'Plot';
}

// ---------- analysis, chat, add ----------
function notice(text) {
  const n = document.createElement('div'); n.className = 'notice error'; n.textContent = text;
  $('#main').prepend(n); setTimeout(() => n.remove(), 6000);
}
async function runAnalyze(a) {
  $('#main').innerHTML = `<div class="empty"><div><p class="eyebrow">${esc(a.label)}</p>
    <h1>Reading the <em>shelf</em>.</h1><p class="hint" style="margin:0 auto">Fetching the feed, embedding every book, matching the corpus, scoring neighbours. About a minute.</p></div></div>`;
  try { await post('/api/accounts/' + a.id + '/analyze', {}); await select(a); }
  catch (e) {
    $('#main').innerHTML = `<div class="empty"><div><p class="eyebrow">${esc(a.label)}</p><h1>Could not read this shelf.</h1>
      <div class="notice error" style="text-align:left">${esc(e.message)}</div><button class="primary" id="run">Try again</button></div></div>`;
    $('#run').onclick = () => runAnalyze(a);
  }
}
async function send() {
  const t = $('#msg').value.trim(); if (!t) return;
  $('#msg').value = '';
  const log = $('#log');
  const u = document.createElement('div'); u.className = 'msg user'; u.textContent = t; log.appendChild(u);
  const w = document.createElement('div'); w.className = 'msg bot wait'; w.textContent = 'reading the shelf…'; log.appendChild(w);
  log.scrollTop = log.scrollHeight;
  try {
    const d = await post('/api/accounts/' + sel.id + '/chat', {message: t, history});
    w.className = 'msg bot'; w.textContent = d.reply;          // textContent: model output never becomes HTML
    history.push({role: 'user', content: t}, {role: 'assistant', content: d.reply});
  } catch (e) { w.className = 'msg bot'; w.textContent = 'The agent could not answer: ' + e.message; }
  log.scrollTop = log.scrollHeight;
}
$('#cancelAdd').onclick = () => $('#addDialog').close();
$('#addForm').onsubmit = async e => {
  e.preventDefault();
  const url = $('#url').value.trim(); if (!url) return;
  const btn = $('#confirmAdd'); btn.disabled = true;
  try {
    const a = await post('/api/accounts', {url_or_id: url, label: $('#label').value.trim()});
    $('#url').value = ''; $('#label').value = ''; $('#addDialog').close();
    await loadReaders(); select(readers.find(x => x.id === a.id));
  } catch (err) { notice(err.message); }
  btn.disabled = false;
};
loadReaders().then(() => { if (!sel) renderEmpty(null); });
</script>
