<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book Match</title>
<meta name="description" content="A taste engine for one person's library: decide on candidates, see the shelf on any axis, ask the shelf.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%231f3de6%27/%3E%3Cpath d=%27M8 7h5a3 3 0 0 1 3 3v15a2 2 0 0 0-2-2H8zM24 7h-5a3 3 0 0 0-3 3v15a2 2 0 0 1 2-2h6z%27 fill=%27%23f2f3ee%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* One screen, no page scroll at desktop. Cobalt on cool bone; one accent, verdicts told
     apart by fill and outline, not by four hues. Radius 8 everywhere. */
  :root {
    --bg: #f2f3ee; --panel: #ffffff; --panel-2: #e9ebe4; --line: #d6d9cf; --line-2: #b9bdb1;
    --ink: #10121c; --muted: #5d6272; --faint: #9a9fae;
    --accent: #1f3de6; --accent-2: #0d2199; --accent-soft: #e4e8ff;
    --font: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --r: 8px; --bar: 56px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1118; --panel: #171a25; --panel-2: #1f2331; --line: #2a2f40; --line-2: #3b4157;
            --ink: #eceef6; --muted: #a2a8bb; --faint: #6a7088; --accent: #5c78ff; --accent-2: #9fb0ff; --accent-soft: #1c2452; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font: 15px/1.45 var(--font); color: var(--ink); background: var(--bg); overflow: hidden; }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r); padding: .45rem .8rem; }
  button:active { transform: translateY(1px); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.ghost { background: transparent; border-color: transparent; color: var(--muted); }
  button.ghost:hover { color: var(--ink); background: var(--panel-2); }
  button:disabled { opacity: .5; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input, select { background: var(--panel); border: 1px solid var(--line-2); border-radius: var(--r); padding: .45rem .6rem; width: 100%; }
  input::placeholder { color: var(--faint); }
  h2 { font-size: 1rem; font-weight: 700; margin: 0 0 .6rem; letter-spacing: -.01em; }
  .mono { font-family: var(--mono); font-size: .74rem; }
  .muted { color: var(--muted); }

  /* bar */
  .bar { height: var(--bar); display: flex; align-items: center; gap: .8rem; padding: 0 1rem; border-bottom: 1px solid var(--line); background: var(--panel); }
  .brand { font-weight: 800; font-size: 1.25rem; letter-spacing: -.03em; font-variation-settings: "opsz" 96; }
  .brand span { color: var(--accent); }
  .bar select { width: auto; min-width: 9rem; }
  .bar .stats { color: var(--muted); }
  .bar .grow { flex: 1; }
  .tabs { display: none; gap: .2rem; }
  .tabs button { padding: .3rem .6rem; }
  .tabs button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  /* stage: left decides, right sees */
  .stage { height: calc(100dvh - var(--bar)); display: grid; grid-template-columns: 440px 1fr; grid-template-rows: minmax(0, 1.45fr) minmax(0, .75fr) minmax(0, .95fr); gap: 1px; background: var(--line); }
  .pane { background: var(--bg); padding: 1rem 1.1rem; min-height: 0; overflow: auto; }
  .decide { grid-row: 1 / -1; display: flex; flex-direction: column; gap: .9rem; }
  .axis { grid-column: 2; }
  .ledger { grid-column: 2; }
  .shelf { grid-column: 2; }

  /* spine rail */
  .rail { display: flex; align-items: center; gap: .8rem; }
  .rail .count { font-family: var(--mono); font-size: .8rem; white-space: nowrap; }
  .spines { display: flex; gap: 3px; flex: 1; height: 22px; align-items: flex-end; }
  .spines i { flex: 1; max-width: 14px; height: 16px; border: 1.5px solid var(--line-2); border-radius: 2px; background: var(--panel); transition: height .2s, background .2s; }
  .spines i.cur { height: 22px; border-color: var(--accent); }
  .spines i.want { background: var(--accent); border-color: var(--accent); }
  .spines i.read { background: var(--ink); border-color: var(--ink); }
  .spines i.disliked { background: repeating-linear-gradient(135deg, var(--ink) 0 2px, transparent 2px 5px); border-color: var(--ink); }
  .spines i.not_interested { background: var(--panel-2); border-style: dashed; }

  /* the card */
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 1.1rem 1.2rem 1rem; display: flex; flex-direction: column; gap: .7rem; }
  .card .place { font-size: .9rem; color: var(--muted); margin: 0; }
  .card .place b { color: var(--ink); font-weight: 600; }
  .card .title { font-size: clamp(1.7rem, 2.6vw, 2.3rem); font-weight: 700; line-height: 1.05; letter-spacing: -.025em; font-variation-settings: "opsz" 96; margin: 0; }
  .card .author { color: var(--muted); font-size: 1.05rem; margin: 0; }
  .support { display: grid; gap: .25rem; margin-top: .2rem; }
  .support .track { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
  .support .track i { display: block; height: 100%; width: var(--w); background: var(--accent); }
  .support .mono { color: var(--muted); }
  .verdicts { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin-top: .3rem; }
  .verdicts button { text-align: left; padding: .6rem .7rem; display: grid; gap: .1rem; }
  .verdicts b { font-weight: 700; }
  .verdicts small { color: var(--muted); font-size: .78rem; }
  .verdicts kbd { float: right; font-family: var(--mono); font-size: .7rem; color: var(--muted); border: 1px solid var(--line-2); border-radius: 4px; padding: 0 .3rem; }
  .verdicts button[data-v="want"]:hover { border-color: var(--accent); background: var(--accent-soft); }
  .verdicts button[data-v="read"]:hover { border-color: var(--ink); }
  .verdicts button[data-v="disliked"]:hover { border-color: var(--ink); text-decoration: line-through; }
  .verdicts button[data-v="not_interested"]:hover { border-style: dashed; }
  .card.out { opacity: 0; transform: translateX(-10px); transition: opacity .18s, transform .18s; }
  .card.in { animation: slidein .22s ease-out; }
  @keyframes slidein { from { opacity: 0; transform: translateX(10px); } }
  .nav { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: .85rem; }
  .nav kbd { font-family: var(--mono); font-size: .7rem; border: 1px solid var(--line-2); border-radius: 4px; padding: 0 .3rem; }
  .undo { display: flex; align-items: center; gap: .6rem; background: var(--ink); color: var(--bg); border-radius: var(--r); padding: .5rem .7rem; font-size: .9rem; }
  .undo[hidden] { display: none; }
  .undo .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .undo button { background: var(--bg); color: var(--ink); border-color: var(--bg); padding: .25rem .6rem; font-weight: 600; }
  .empty { display: grid; place-items: center; text-align: center; flex: 1; color: var(--muted); }
  .empty h1 { font-size: 1.6rem; letter-spacing: -.02em; color: var(--ink); margin: 0 0 .4rem; }

  /* axis */
  .axis-form { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: .4rem; align-items: center; }
  .axis-form .vs { color: var(--muted); font-weight: 600; }
  .presets { display: flex; gap: .3rem; flex-wrap: wrap; margin: .4rem 0 .2rem; }
  .presets button { font-size: .78rem; padding: .2rem .5rem; color: var(--muted); }
  .poles { display: flex; justify-content: space-between; font-weight: 700; margin: .5rem 0 0; }
  .poles span:last-child { color: var(--accent); }
  .spectrum { display: block; width: 100%; height: auto; }
  .spectrum .tick { stroke: var(--ink); stroke-linecap: round; opacity: .35; }
  .spectrum .tick.loved { opacity: 1; }
  .spectrum .tick.tolerated { opacity: .18; }
  .spectrum .cand { fill: var(--panel); stroke: var(--accent); stroke-width: 1.5; }
  .spectrum .cand.cur { fill: var(--accent); }
  .spectrum .guide { stroke: var(--accent); stroke-dasharray: 2 3; }
  .spectrum text { font-family: var(--font); font-size: 13px; font-weight: 700; fill: var(--accent); }
  .reading { margin: .2rem 0 .5rem; font-weight: 600; }
  .ends { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; font-size: .84rem; }
  .ends div span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ends .right { text-align: right; }
  .ends div span { display: block; padding: .12rem 0; }
  .ends .a { color: var(--muted); }
  .ends .c { color: var(--accent); }

  /* ledger + shelf: four columns each */
  .cols { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .9rem; font-size: .86rem; }
  .cols h3 { font-size: .86rem; margin: 0 0 .35rem; display: flex; justify-content: space-between; align-items: baseline; }
  .cols h3 .mono { color: var(--muted); }
  .cols .item { display: flex; gap: .4rem; align-items: baseline; padding: .18rem 0; border-top: 1px solid var(--line); }
  .cols .item .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cols .item .a { color: var(--muted); font-size: .78rem; }
  .cols .item .r { font-family: var(--mono); font-size: .72rem; color: var(--muted); }
  .cols .item .r.loved { color: var(--accent); }
  .cols .item button { padding: 0 .35rem; font-size: .75rem; line-height: 1.4; }
  .ledger h3 b.want { color: var(--accent); }
  .ledger h3 b.disliked { text-decoration: line-through; }
  .ledger h3 b.not_interested { color: var(--muted); }
  .pending { display: flex; align-items: center; gap: .6rem; background: var(--accent-soft); border-radius: var(--r); padding: .4rem .7rem; margin-bottom: .6rem; font-size: .88rem; }
  .pending .grow { flex: 1; }
  .notice { background: var(--accent-soft); border-radius: var(--r); padding: .5rem .7rem; margin-bottom: .6rem; }
  .notice.error { background: #ffe6e0; color: #6b1b0c; }
  @media (prefers-color-scheme: dark) { .notice.error { background: #4a1a10; color: #ffd5cb; } }

  /* ask drawer */
  .drawer { position: fixed; top: var(--bar); right: 0; bottom: 0; width: min(460px, 100vw); background: var(--panel); border-left: 1px solid var(--line); transform: translateX(100%); transition: transform .25s ease; display: flex; flex-direction: column; padding: 1rem 1.1rem; z-index: 10; }
  .drawer.open { transform: none; box-shadow: -20px 0 40px rgba(0,0,0,.12); }
  .drawer .log { flex: 1; overflow: auto; display: flex; flex-direction: column; gap: .5rem; margin: .5rem 0; }
  .msg { padding: .5rem .7rem; border-radius: var(--r); white-space: pre-wrap; line-height: 1.4; max-width: 90%; }
  .msg.user { background: var(--accent-soft); align-self: flex-end; }
  .msg.bot { background: var(--bg); border: 1px solid var(--line); align-self: flex-start; }
  .msg.bot.wait { color: var(--muted); }
  .row { display: flex; gap: .4rem; }
  .examples { display: flex; gap: .3rem; flex-wrap: wrap; margin-top: .4rem; }
  .examples button { font-size: .78rem; padding: .2rem .5rem; color: var(--muted); }

  dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line-2); border-radius: 12px; padding: 1.1rem 1.2rem; width: min(440px, 92vw); }
  dialog::backdrop { background: rgba(10,12,20,.55); }
  dialog label { display: block; font-size: .8rem; color: var(--muted); margin: .6rem 0 .2rem; }
  dialog .actions { display: flex; gap: .5rem; justify-content: flex-end; margin-top: 1rem; }

  /* phone: one region at a time, picked from the bar */
  @media (max-width: 900px) {
    body { overflow: auto; }
    .bar { flex-wrap: wrap; height: auto; padding: .6rem .8rem; gap: .5rem; }
    .bar .stats { display: none; }
    .tabs { display: flex; width: 100%; }
    .stage { display: block; height: auto; }
    .pane { display: none; padding: .9rem; }
    body[data-view="decide"] .decide, body[data-view="axis"] .axis, body[data-view="ledger"] .ledger, body[data-view="shelf"] .shelf { display: flex; flex-direction: column; min-height: calc(100dvh - 110px); }
    .axis-form { grid-template-columns: 1fr; } .axis-form .vs { text-align: center; }
    .cols { grid-template-columns: 1fr 1fr; }
    .ends { grid-template-columns: 1fr; } .ends .right { text-align: left; }
    .drawer { top: 0; width: 100vw; }
    .nav span { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .card.in, .card.out, .drawer { animation: none; transition: none; } }
</style>
</head>
<body data-view="decide">
<header class="bar">
  <div class="brand">Book<span>Match</span></div>
  <select id="reader" aria-label="Reader"></select>
  <button id="openAdd" class="ghost">+ Reader</button>
  <span class="stats" id="stats"></span>
  <span class="grow"></span>
  <nav class="tabs" aria-label="View">
    <button data-view="decide" aria-pressed="true">Decide</button><button data-view="axis">Axis</button><button data-view="ledger">Decided</button><button data-view="shelf">Shelf</button>
  </nav>
  <button id="askBtn" class="primary">Ask the shelf</button>
</header>

<main class="stage">
  <section class="pane decide" id="decide"></section>
  <section class="pane axis" id="axis"></section>
  <section class="pane ledger" id="ledger"></section>
  <section class="pane shelf" id="shelf"></section>
</main>

<aside class="drawer" id="drawer" aria-label="Ask the shelf">
  <div class="row" style="justify-content:space-between;align-items:center"><h2 style="margin:0" id="askTitle">Ask the shelf</h2><button class="ghost" id="closeAsk">Close</button></div>
  <p class="muted" style="margin:.3rem 0 0;font-size:.86rem">The agent knows this shelf and the candidates, and plots an axis itself when the question needs one.</p>
  <div class="log" id="log" aria-live="polite"></div>
  <div class="row"><input id="msg" placeholder="e.g. something for a long train ride, nothing bleak" aria-label="message"><button class="primary" id="send">Ask</button></div>
  <div class="examples" id="examples"></div>
</aside>

<dialog id="addDialog">
  <h2>Add a reader</h2>
  <p class="muted" style="margin:0;font-size:.9rem">Any public Goodreads profile. A private profile is reported, never guessed.</p>
  <form method="dialog" id="addForm">
    <label for="url">Goodreads profile URL or user id</label><input id="url" required placeholder="https://www.goodreads.com/user/show/12345678">
    <label for="label">Name to show</label><input id="label" placeholder="e.g. Mom">
    <div class="actions"><button type="button" class="ghost" id="cancelAdd">Cancel</button><button class="primary">Add reader</button></div>
  </form>
</dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const key = b => `${(b.title || '').toLowerCase()}|${(b.author || '').toLowerCase()}`;
const PRESETS = [
  ['French vs American', ['French literature', 'a novel set in France'], ['American literature', 'a novel set in small-town America']],
  ['Melancholy vs comic', ['melancholy, grief, quiet sorrow'], ['comic, light-hearted, funny']],
  ['Summer vs winter', ['summer, heat, the sea, holidays'], ['winter, snow, cold, long nights']],
  ['Experimental vs conventional', ['experimental form, fragmented, avant-garde'], ['conventional, plot-driven, straightforward']],
];
const VERDICTS = [
  ['want', 'Want to read', 'kept on your list', 'W'],
  ['read', 'Read it', 'joins the shelf next analysis', 'R'],
  ['disliked', "Didn't like it", 'joins the shelf, low rating', 'D'],
  ['not_interested', 'Not interested', 'hidden', 'N'],
];
const VLABEL = Object.fromEntries(VERDICTS.map(v => [v[0], v[1]]));
const KEYS = {w: 'want', r: 'read', d: 'disliked', n: 'not_interested', 1: 'want', 2: 'read', 3: 'disliked', 4: 'not_interested'};

let readers = [], sel = null, data = null, deck = [], cur = 0, undoStack = [], axisRes = null, history = [];

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) { const e = await r.json().catch(() => ({detail: r.statusText})); throw new Error(e.detail || r.statusText); }
  return r.json();
}
const call = (m, p, b) => api(p, {method: m, headers: {'Content-Type': 'application/json'}, body: JSON.stringify(b)});
const post = (p, b) => call('POST', p, b);

// ---------- readers ----------
async function loadReaders(keep) {
  readers = await api('/api/accounts');
  $('#reader').innerHTML = readers.map(a => `<option value="${a.id}">${esc(a.label)}${a.analyzed ? '' : ' (not analyzed)'}</option>`).join('');
  if (keep && readers.some(a => a.id === keep)) $('#reader').value = keep;
}
async function select(id) {
  sel = readers.find(a => a.id == id); if (!sel) return;
  $('#reader').value = sel.id; history = []; undoStack = []; axisRes = null; $('#log').innerHTML = '';
  data = await api('/api/accounts/' + sel.id);
  render();
}
$('#reader').onchange = e => select(Number(e.target.value));

// ---------- render ----------
function render() {
  const an = data.analysis;
  $('#stats').textContent = an ? `${an.profile.n_books} books · ${an.profile.n_rated} rated · ${Math.round(an.match_rate * 100)}% in the corpus` : '';
  $('#askTitle').textContent = `Ask ${sel.label}'s shelf`;
  $('#examples').innerHTML = [`What would ${sel.label} think of Elena Ferrante?`, 'Pick the three candidates most like what they love.', 'Which favourite is least like the rest?']
    .map(q => `<button type="button">${esc(q)}</button>`).join('');
  document.querySelectorAll('#examples button').forEach(b => b.onclick = () => { $('#msg').value = b.textContent; send(); });
  if (!an) {
    $('#decide').innerHTML = `<div class="empty"><div><h1>${esc(sel.label)} has not been analyzed.</h1><p>The shelf is fetched, embedded, matched into 876k readers. About a minute.</p><button class="primary" id="run">Analyze shelf</button></div></div>`;
    $('#run').onclick = runAnalyze;
    $('#axis').innerHTML = $('#ledger').innerHTML = $('#shelf').innerHTML = '';
    return;
  }
  deck = an.recs.slice(); cur = 0;
  renderDeck(); renderAxisForm(); renderLedger(); renderShelf();
  const [, pos, neg] = PRESETS[0]; $('#pos').value = pos.join(', '); $('#neg').value = neg.join(', '); plotAxis();
}

function renderDeck(anim) {
  const total = deck.length + decidedCount();
  const spines = [...data.verdicts.want, ...data.verdicts.read, ...data.verdicts.disliked, ...data.verdicts.not_interested].map(v => v.verdict)
    .concat(deck.map((_, i) => i === cur ? 'cur' : ''));
  const b = deck[cur];
  $('#decide').innerHTML = `
    <div class="rail"><span class="count">${deck.length ? `${cur + 1} of ${deck.length}` : 'deck clear'}</span><div class="spines" aria-hidden="true">${spines.map(c => `<i class="${c}"></i>`).join('')}</div></div>
    ${b ? `<article class="card ${anim || ''}">
      <h1 class="title">${esc(b.title)}</h1>
      <p class="author">${esc(b.author)}</p>
      <p class="place" id="place"></p>
      <div class="support"><div class="track"><i style="--w:${Math.round(100 * (b.n_supporters || 0) / Math.max(1, ...data.analysis.recs.map(r => r.n_supporters || 0)))}%"></i></div>
        <span class="mono">${esc(b.n_supporters)} of the 100 nearest readers rated it 4 or more</span></div>
      <div class="verdicts" role="group" aria-label="Your verdict">${VERDICTS.map(([v, l, e, k]) => `<button type="button" data-v="${v}"><b>${esc(l)}<kbd>${k}</kbd></b><small>${esc(e)}</small></button>`).join('')}</div>
    </article>
    <div class="nav"><button class="ghost" id="prev" ${cur === 0 ? 'disabled' : ''}>← Previous</button><span><kbd>W</kbd> <kbd>R</kbd> <kbd>D</kbd> <kbd>N</kbd> decide · <kbd>Z</kbd> undo</span><button class="ghost" id="next" ${cur >= deck.length - 1 ? 'disabled' : ''}>Later →</button></div>`
    : `<div class="empty"><div><h1>Every candidate has a verdict.</h1><p>Re-analyze to bring a fresh set, with your verdicts applied.</p><button class="primary" id="run">Re-analyze</button></div></div>`}
    <div class="undo" id="undo" hidden><span class="t" id="undoText"></span><button id="undoBtn">Undo</button></div>`;
  if (b) {
    document.querySelectorAll('#decide .verdicts button').forEach(btn => btn.onclick = () => decide(btn.dataset.v));
    $('#prev').onclick = () => { cur = Math.max(0, cur - 1); renderDeck('in'); markCurrent(); };
    $('#next').onclick = () => { cur = Math.min(deck.length - 1, cur + 1); renderDeck('in'); markCurrent(); };
  } else { $('#run').onclick = runAnalyze; }
  $('#undoBtn').onclick = undo;
  showUndo();
  markCurrent();
}
const decidedCount = () => Object.values(data.verdicts).reduce((n, l) => n + l.length, 0);
function showUndo() {
  const u = undoStack[undoStack.length - 1];
  $('#undo').hidden = !u;
  if (u) $('#undoText').textContent = `${u.book.title}: ${VLABEL[u.verdict]}${undoStack.length > 1 ? ` · ${undoStack.length} undoable` : ''}`;
}

// ---------- verdicts ----------
async function decide(v) {
  const book = deck[cur]; if (!book) return;
  const card = $('#decide .card'); if (card) card.classList.add('out');
  const idx = cur; deck.splice(idx, 1); if (cur >= deck.length) cur = Math.max(0, deck.length - 1);
  try {
    await post('/api/accounts/' + sel.id + '/verdict', {title: book.title, author: book.author || '', verdict: v});
    undoStack.push({book, verdict: v, idx});
    data = await api('/api/accounts/' + sel.id);
    renderDeck('in'); renderLedger();
  } catch (e) {
    deck.splice(idx, 0, book); cur = idx; renderDeck(); flash(e.message);
  }
}
async function undo() {
  const u = undoStack.pop(); if (!u) return;
  try {
    await call('DELETE', '/api/accounts/' + sel.id + '/verdict', {title: u.book.title, author: u.book.author || ''});
    data = await api('/api/accounts/' + sel.id);
    deck.splice(Math.min(u.idx, deck.length), 0, u.book); cur = Math.min(u.idx, deck.length - 1);
    renderDeck('in'); renderLedger();
  } catch (e) { undoStack.push(u); flash(e.message); }
}
async function undoRow(book) {
  try {
    await call('DELETE', '/api/accounts/' + sel.id + '/verdict', {title: book.title, author: book.author || ''});
    const i = undoStack.findIndex(u => key(u.book) === key(book)); if (i >= 0) undoStack.splice(i, 1);
    data = await api('/api/accounts/' + sel.id);
    if (!deck.some(b => key(b) === key(book))) deck.push({title: book.title, author: book.author, n_supporters: 0});
    renderDeck(); renderLedger();
  } catch (e) { flash(e.message); }
}
async function reverdict(book, v) {
  try { await post('/api/accounts/' + sel.id + '/verdict', {title: book.title, author: book.author || '', verdict: v});
    data = await api('/api/accounts/' + sel.id); renderDeck(); renderLedger();
  } catch (e) { flash(e.message); }
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select') || !data || !data.analysis) return;
  const k = e.key.toLowerCase();
  if (KEYS[k]) { e.preventDefault(); decide(KEYS[k]); }
  else if (k === 'z' || (k === 'z' && (e.ctrlKey || e.metaKey))) { e.preventDefault(); undo(); }
  else if (e.key === 'ArrowRight' && cur < deck.length - 1) { cur++; renderDeck('in'); }
  else if (e.key === 'ArrowLeft' && cur > 0) { cur--; renderDeck('in'); }
});

function renderLedger() {
  const g = data.verdicts, pending = data.pending_shelf_changes || 0;
  $('#ledger').innerHTML = `<h2>Decided <span class="mono muted">${decidedCount()}</span></h2>
    ${pending ? `<div class="pending"><span class="grow">${pending} read or didn't-like verdict${pending > 1 ? 's' : ''} will join the shelf at the next analysis.</span><button id="runPending">Re-analyze</button></div>` : ''}
    <div class="cols">${VERDICTS.map(([v, l]) => `<div><h3><b class="${v}">${esc(l)}</b><span class="mono">${g[v].length}</span></h3>
      ${g[v].map((b, i) => `<div class="item" data-v="${v}" data-i="${i}"><span class="t">${esc(b.title)} <span class="a">${esc(b.author)}</span></span>
        ${v === 'want' ? `<button class="ghost" data-to="read" title="Read it">R</button><button class="ghost" data-to="disliked" title="Didn't like it">D</button>` : ''}
        <button class="ghost" data-to="undo" title="Undo">×</button></div>`).join('')}</div>`).join('')}</div>`;
  if (pending) $('#runPending').onclick = runAnalyze;
  document.querySelectorAll('#ledger .item button').forEach(btn => btn.onclick = () => {
    const it = btn.closest('.item'); const b = g[it.dataset.v][Number(it.dataset.i)];
    btn.dataset.to === 'undo' ? undoRow(b) : reverdict(b, btn.dataset.to);
  });
}

function renderShelf() {
  const p = data.analysis.profile;
  const r = b => b.myrating ? `<span class="r ${b.myrating >= 4 ? 'loved' : ''}">${b.myrating.toFixed(0)}</span>` : '<span class="r">–</span>';
  const col = (title, list) => `<div><h3>${title}</h3>${list.slice(0, 5).map(b => `<div class="item"><span class="t">${esc(b.title)} <span class="a">${esc(b.author)}</span></span>${r(b)}</div>`).join('')}</div>`;
  $('#shelf').innerHTML = `<h2>Shelf <span class="mono muted">mean ${p.mean_rating}</span></h2><div class="cols">
    ${col('Loves most', p.loved || [])}${col('Merely tolerates', p.tolerated || [])}${col('Loves more than the crowd', p.loves_more_than_world || [])}${col('Blind spot', p.blind_spot || [])}</div>`;
}

// ---------- axis ----------
function renderAxisForm() {
  $('#axis').innerHTML = `<h2>Axis</h2>
    <form class="axis-form" id="axisForm"><input id="neg" placeholder="negative pole" aria-label="negative pole"><span class="vs">vs</span><input id="pos" placeholder="positive pole" aria-label="positive pole" required><button class="primary" id="plot">Plot</button></form>
    <div class="presets">${PRESETS.map((pr, i) => `<button type="button" data-p="${i}">${esc(pr[0])}</button>`).join('')}</div>
    <div id="axisOut"><p class="muted">Every book on the shelf and every candidate is placed by one dot product between two ideas. The book you are deciding on is marked.</p></div>`;
  $('#axisForm').onsubmit = e => { e.preventDefault(); plotAxis(); };
  document.querySelectorAll('.presets button').forEach(b => b.onclick = () => { const [, pos, neg] = PRESETS[b.dataset.p]; $('#pos').value = pos.join(', '); $('#neg').value = neg.join(', '); plotAxis(); });
}
const split = s => s.split(',').map(t => t.trim()).filter(Boolean);
async function plotAxis() {
  const pos = split($('#pos').value), neg = split($('#neg').value);
  if (!pos.length) return flash('Name at least one phrase for the positive pole.');
  const btn = $('#plot'); btn.disabled = true; btn.textContent = 'Plotting';
  try {
    axisRes = await post('/api/accounts/' + sel.id + '/axis', {label: (pos[0] || 'axis').split(' ')[0].toLowerCase(), positive: pos, negative: neg});
    axisRes.left = neg.length ? neg[0] : 'opposite'; axisRes.right = pos[0];
    markCurrent();
  } catch (e) { $('#axisOut').innerHTML = `<div class="notice error">${esc(e.message)}</div>`; }
  btn.disabled = false; btn.textContent = 'Plot';
}
function drawAxis() {
  if (!axisRes) return;
  const res = axisRes, X = x => 500 + x * 450, curKey = deck[cur] ? key(deck[cur]) : null;
  const ticks = res.shelf.map(b => { const h = b.myrating ? 12 + b.myrating * 6 : 9;
    return `<line class="tick ${b.myrating >= 4 ? 'loved' : b.myrating > 0 && b.myrating <= 2 ? 'tolerated' : ''}" x1="${X(b.x).toFixed(1)}" x2="${X(b.x).toFixed(1)}" y1="78" y2="${78 - h}" stroke-width="2"><title>${esc(b.title)}, ${esc(b.author)}</title></line>`; }).join('');
  const rows = [-Infinity, -Infinity, -Infinity]; let curMark = '';
  const cands = [...res.candidates].sort((a, b) => a.x - b.x).map((c, i) => {
    const row = i % 3, cx = Math.max(X(c.x), rows[row] + 12); rows[row] = cx; const isCur = key(c) === curKey;
    if (isCur) curMark = `<line class="guide" x1="${cx.toFixed(1)}" x2="${cx.toFixed(1)}" y1="20" y2="${92 + row * 10}"/><text x="${cx.toFixed(1)}" y="14" text-anchor="${cx > 760 ? 'end' : cx < 240 ? 'start' : 'middle'}">${esc(c.title)}</text>`;
    const d = 5, cy = 92 + row * 10;
    return `<path class="cand ${isCur ? 'cur' : ''}" d="M${cx} ${cy - d}L${cx + d} ${cy}L${cx} ${cy + d}L${cx - d} ${cy}Z"><title>candidate: ${esc(c.title)}, ${esc(c.author)}</title></path>`; }).join('');
  const top = res.shelf.slice(0, 3), bottom = res.shelf.slice(-3).reverse(), ct = res.candidates.slice(0, 1), cb = res.candidates.slice(-1);
  $('#axisOut').innerHTML = `<div class="poles"><span>← ${esc(res.left)}</span><span>${esc(res.right)} →</span></div>
    <svg class="spectrum" viewBox="0 0 1000 118" role="img" aria-label="Books placed along the axis">
      <line x1="40" x2="960" y1="78" y2="78" stroke="var(--line-2)"/><line x1="500" x2="500" y1="72" y2="84" stroke="var(--line-2)"/>${ticks}${curMark}${cands}</svg>
    <p class="reading">${esc(res.rating_agreement.reading)}</p>
    <div class="ends"><div>${bottom.map(b => `<span>${esc(b.title)} <span class="a">${esc(b.author)}</span></span>`).join('')}${cb.map(b => `<span class="c">${esc(b.title)} <span class="a">${esc(b.author)}</span></span>`).join('')}</div>
      <div class="right">${top.map(b => `<span>${esc(b.title)} <span class="a">${esc(b.author)}</span></span>`).join('')}${ct.map(b => `<span class="c">${esc(b.title)} <span class="a">${esc(b.author)}</span></span>`).join('')}</div></div>`;
}
function markCurrent() {
  if (!axisRes) return; drawAxis();
  const el = $('#place'); const b = deck[cur]; if (!el || !b) return;
  const c = axisRes.candidates.find(x => key(x) === key(b)); if (!c) { el.textContent = ''; return; }
  const shelf = [...axisRes.shelf].sort((p, q) => Math.abs(p.x - c.x) - Math.abs(q.x - c.x)).slice(0, 2);
  const side = c.x > 0.08 ? `on the ${axisRes.right} side` : c.x < -0.08 ? `on the ${axisRes.left} side` : 'in the middle';
  el.innerHTML = `On this axis it sits ${esc(side)}, next to ${shelf.map(s => `<b>${esc(s.title)}</b>`).join(' and ')}.`;
}

// ---------- analysis, chat, add, views ----------
function flash(text) {
  const n = document.createElement('div'); n.className = 'notice error'; n.textContent = text;
  $('#decide').prepend(n); setTimeout(() => n.remove(), 6000);
}
async function runAnalyze() {
  $('#decide').innerHTML = `<div class="empty"><div><h1>Reading ${esc(sel.label)}'s shelf.</h1><p>Fetching the feed, embedding every book, matching the corpus, scoring neighbours. About a minute.</p></div></div>`;
  try { await post('/api/accounts/' + sel.id + '/analyze', {}); await select(sel.id); }
  catch (e) { $('#decide').innerHTML = `<div class="empty"><div><h1>Could not read this shelf.</h1><div class="notice error">${esc(e.message)}</div><button class="primary" id="run">Try again</button></div></div>`; $('#run').onclick = runAnalyze; }
}
async function send() {
  const t = $('#msg').value.trim(); if (!t || !sel) return;
  $('#msg').value = ''; const log = $('#log');
  const u = document.createElement('div'); u.className = 'msg user'; u.textContent = t; log.appendChild(u);
  const w = document.createElement('div'); w.className = 'msg bot wait'; w.textContent = 'reading the shelf'; log.appendChild(w); log.scrollTop = log.scrollHeight;
  try { const d = await post('/api/accounts/' + sel.id + '/chat', {message: t, history}); w.className = 'msg bot'; w.textContent = d.reply; history.push({role: 'user', content: t}, {role: 'assistant', content: d.reply}); }
  catch (e) { w.className = 'msg bot'; w.textContent = 'The agent could not answer: ' + e.message; }
  log.scrollTop = log.scrollHeight;
}
$('#send').onclick = send; $('#msg').onkeydown = e => { if (e.key === 'Enter') send(); };
$('#askBtn').onclick = () => { $('#drawer').classList.add('open'); $('#msg').focus(); };
$('#closeAsk').onclick = () => $('#drawer').classList.remove('open');
$('#openAdd').onclick = () => $('#addDialog').showModal();
$('#cancelAdd').onclick = () => $('#addDialog').close();
$('#addForm').onsubmit = async e => {
  e.preventDefault(); const url = $('#url').value.trim(); if (!url) return;
  try { const a = await post('/api/accounts', {url_or_id: url, label: $('#label').value.trim()}); $('#addDialog').close(); $('#url').value = ''; $('#label').value = '';
    await loadReaders(a.id); await select(a.id); } catch (err) { flash(err.message); }
};
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { document.body.dataset.view = b.dataset.view; document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-pressed', x === b)); });
loadReaders().then(() => { if (readers.length) select(readers[0].id); else $('#decide').innerHTML = `<div class="empty"><div><h1>Add a reader to begin.</h1><p>Any public Goodreads profile.</p><button class="primary" id="openAdd2">Add a reader</button></div></div>`, $('#openAdd2').onclick = () => $('#addDialog').showModal(); });
</script>
</body>
